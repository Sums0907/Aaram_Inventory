version: '3.8'

services:
  api:
    image: ghcr.io/sums0907/aaram_inventory-backend:main
    restart: always
    environment:
      # Expecting the bare-metal postgres connection URL in the VPS .env file
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=production
      - AUTH_MODE=${AUTH_MODE}
      - AARAMIDENTITY_PUBLIC_KEY=${AARAMIDENTITY_PUBLIC_KEY}
      - IDENTITY_API_URL=${IDENTITY_API_URL:-${IDENTITY_SERVICE_URL:-https://api-identity.aarambooks.cloud}}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL:-https://api-identity.aarambooks.cloud}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://inventory.aarambooks.cloud}
      - SHOPDECK_SALES_WAREHOUSE_CODE=${SHOPDECK_SALES_WAREHOUSE_CODE:-348_SECTOR_11_PANIPAT}
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      # Map to 8100 locally to avoid conflict with Identity on 8000
      - "127.0.0.1:8100:8000"
    networks:
      - aarambooks_network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  frontend:
    image: ghcr.io/sums0907/aaram_inventory-frontend:main
    restart: always
    ports:
      # Map to 3100 locally to avoid conflict with Identity on 3000
      - "127.0.0.1:3100:80"
    networks:
      - aarambooks_network

networks:
  aarambooks_network:
    driver: bridge
