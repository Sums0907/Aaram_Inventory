version: '3.8'

services:
  api:
    image: ghcr.io/sums0907/aaram_inventory-backend:main
    restart: always
    environment:
      # Expecting the bare-metal postgres connection URL in the VPS .env file
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=production
      - AUTH_MODE=${AUTH_MODE}
      - AARAMIDENTITY_PUBLIC_KEY=${AARAMIDENTITY_PUBLIC_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      # Map to 8100 locally to avoid conflict with Identity on 8000
      - "127.0.0.1:8100:8000"
    networks:
      - aarambooks_network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  frontend:
    image: ghcr.io/sums0907/aaram_inventory-frontend:main
    restart: always
    ports:
      # Map to 3100 locally to avoid conflict with Identity on 3000
      - "127.0.0.1:3100:80"
    volumes:
      # Inject the production config at runtime
      - ./config.prod.js:/usr/share/nginx/html/config.js:ro
    networks:
      - aarambooks_network

networks:
  aarambooks_network:
    driver: bridge
