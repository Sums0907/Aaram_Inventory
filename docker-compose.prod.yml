version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aarambooks}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aarambooks_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aarambooks}
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - aarambooks_network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --workers 4"

volumes:
  postgres_data:

networks:
  aarambooks_network:
    driver: bridge
